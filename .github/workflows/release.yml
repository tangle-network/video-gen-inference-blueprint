name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: ${{ vars.BINARY_NAME || 'video-gen-operator' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --bin "$BINARY_NAME"

      - name: Package SDK release sources
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          CORE_REVISION=$(python3 -c 'import tomllib; print(tomllib.load(open("operator/Cargo.toml", "rb"))["dependencies"]["tangle-inference-core"]["rev"])')
          [[ "$CORE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/tangle-network/tangle-inference-core/$CORE_REVISION/scripts/register-blueprint.mjs" -o "$RUNNER_TEMP/register-blueprint.mjs"
          strip "target/release/$BINARY_NAME"
          node "$RUNNER_TEMP/register-blueprint.mjs" --package --definition deploy/definition.json --output-dir release --tag "$TAG" --binary "target/release/$BINARY_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -qx blueprint-definition.json <<< "$ASSETS"; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern blueprint-definition.json --dir "$RUNNER_TEMP/prior-release"
            cmp "$RUNNER_TEMP/prior-release/blueprint-definition.json" release/blueprint-definition.json
          fi
          gh release upload "$TAG" release/*.tar.xz release/*.sha256 release/dist-manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" release/blueprint-definition.json --repo "$GITHUB_REPOSITORY" --clobber
